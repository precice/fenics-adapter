name: Run preCICE Tutorials
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: 'Specify tag for docker container precice/precice:tag'
        required: true
        default: 'nightly'
        type: string

jobs:
  run_ht_simple:
    name: Run HT, simple
    runs-on: ubuntu-latest
    container: precice/precice:${{ inputs.docker_image_tag || 'nightly' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Install Dependencies & FEniCS
        run: |
          apt-get -qq update
          apt-get -qq install software-properties-common python3-dev python3-pip python3-venv git apt-utils openmpi-bin libopenmpi-dev python3-mpi4py
          add-apt-repository -y ppa:fenics-packages/fenics
          apt-get -qq install --no-install-recommends fenics
          rm -rf /var/lib/apt/lists/*
      - name: Create venv for adapter
        run: |
          python3 -m venv --system-site-packages /opt/adapter-venv
          echo "/opt/adapter-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=/opt/adapter-venv" >> "$GITHUB_ENV"
          /opt/adapter-venv/bin/pip install --upgrade pip
      - name: Install adapter
        run: pip install .
      - name: Fix broken FEniCS installation (see https://fenicsproject.discourse.group/t/installing-python-package-with-fenics-dependency-breaks-fenics-installation/4476)
        run: pip uninstall -y fenics-ufl
      - name: Get tutorials
        run: git clone -b develop https://github.com/precice/tutorials.git
      - name: Install adapter for Dirichlet participants
        run: |
          cd tutorials/partitioned-heat-conduction/dirichlet-fenics
          pip install ../../..
      - name: Install adapter for Neumann participants
        run: |
          cd tutorials/partitioned-heat-conduction/neumann-fenics
          pip install ../../..
      - name: Remove fenicsadapter from requirements to avoid overwriting develop version
        run: |
          sed -i '/fenicsprecice/d' tutorials/partitioned-heat-conduction/solver-fenics/requirements.txt
      - name: Run tutorial
        run: |
          cd tutorials/partitioned-heat-conduction
          cd dirichlet-fenics && ./run.sh & cd neumann-fenics && ./run.sh

  run_ht_complex:
    name: Run HT, complex
    runs-on: ubuntu-latest
    container: precice/precice:${{ inputs.docker_image_tag || 'nightly' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Install Dependencies & FEniCS
        run: |
          apt-get -qq update
          apt-get -qq install software-properties-common python3-dev python3-pip python3-venv git apt-utils openmpi-bin libopenmpi-dev python3-mpi4py
          add-apt-repository -y ppa:fenics-packages/fenics
          apt-get -qq install --no-install-recommends fenics
          rm -rf /var/lib/apt/lists/*
      - name: Create venv for adapter
        run: |
          python3 -m venv --system-site-packages /opt/adapter-venv
          echo "/opt/adapter-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=/opt/adapter-venv" >> "$GITHUB_ENV"
          /opt/adapter-venv/bin/pip install --upgrade pip
      - name: Install adapter
        run: pip install .
      - name: Fix broken FEniCS installation (see https://fenicsproject.discourse.group/t/installing-python-package-with-fenics-dependency-breaks-fenics-installation/4476)
        run: pip uninstall -y fenics-ufl
      - name: Get tutorials
        run: git clone -b develop https://github.com/precice/tutorials.git
      - name: Install adapter for Dirichlet participants
        run: |
          cd tutorials/partitioned-heat-conduction-complex/dirichlet-fenics
          pip install ../../..
      - name: Install adapter for Neumann participants
        run: |
          cd tutorials/partitioned-heat-conduction-complex/neumann-fenics
          pip install ../../..
      - name: Remove fenicsadapter from requirements to avoid overwriting develop version
        run: |
          sed -i '/fenicsprecice/d' tutorials/partitioned-heat-conduction-complex/solver-fenics/requirements.txt
      - name: Run tutorial
        run: |
          cd tutorials/partitioned-heat-conduction-complex
          cd dirichlet-fenics && ./run.sh & cd neumann-fenics && ./run.sh
